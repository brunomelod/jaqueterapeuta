<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Torre de módulos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1440px; height: 900px; overflow: hidden; background: #EEF4EA; color: #2E4030; font-family: Sora, sans-serif; }
    nav { display: flex; justify-content: space-between; padding: 18px 48px; font-size: 15px; }
    nav b { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 22px; }
    nav a { color: inherit; text-decoration: none; font-weight: 600; }
    .rack { width: 1100px; margin: 0 auto; }
    .mod { background: #FBFBF7; border: 3px solid #7A9A78; border-radius: 8px; height: 700px; display: grid; grid-template-rows: 56px 1fr 72px; }
    .head { display: flex; align-items: center; gap: 14px; padding: 0 22px; background: #C9DCC6; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
    .screws { display: flex; gap: 8px; }
    .screws i { width: 8px; height: 8px; border-radius: 50%; background: #5A6B5C; display: block; }
    .screen { display: grid; grid-template-columns: 0.9fr 1.1fr; }
    .face { background: #F8F3DC; }
    .copy { padding: 40px 48px; display: flex; flex-direction: column; justify-content: center; }
    h1 { font-family: "Cormorant Garamond", serif; font-size: 72px; font-weight: 500; line-height: 1.02; max-width: 8ch; }
    h1 em { font-style: italic; font-weight: 400; }
    p { margin: 16px 0 0; font-size: 16px; color: #5A6B5C; }
    .foot { display: flex; align-items: center; justify-content: space-between; padding: 0 22px; border-top: 1px solid #C9DCC6; }
    .trace { flex: 1; height: 28px; margin-right: 24px; background: linear-gradient(#C9DCC6, #C9DCC6) 0 50% / 100% 2px no-repeat; }
    .cta { background: #3E5A40; color: #FBFBF7; padding: 14px 22px; border-radius: 8px; font-size: 15px; font-weight: 500; text-decoration: none; }
    .next { width: 1100px; margin: 10px auto 0; height: 52px; border: 3px solid #C9DCC6; border-bottom: 0; border-radius: 8px 8px 0 0; background: #F8F3DC; display: flex; align-items: center; padding: 0 22px; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <nav><b>Jaqueline Secundino</b><a href="#">WhatsApp</a></nav>
  <div class="rack">
    <article class="mod">
      <header class="head"><span class="screws"><i></i><i></i></span> Módulo 01 · Sessão · live</header>
      <div class="screen">
        <div class="face" aria-label="Jaqueline Secundino"></div>
        <div class="copy">
          <h1>A sessão já está <em>aberta.</em></h1>
          <p>Terapeuta emocional · sessões pelo Zoom</p>
        </div>
      </div>
      <footer class="foot">
        <div class="trace" aria-hidden="true"></div>
        <a class="cta" href="#">Entrar pelo WhatsApp</a>
      </footer>
    </article>
  </div>
  <div class="next">Módulo 02 · Peso</div>
</body>
</html>
