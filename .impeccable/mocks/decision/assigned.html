<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Alarmes quietos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1440px; height: 900px; overflow: hidden; background: #FBFBF7; color: #2E4030; font-family: Sora, sans-serif; }
    nav { display: flex; justify-content: space-between; padding: 22px 40px; font-size: 15px; }
    nav b { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 22px; }
    nav a { color: #2E4030; text-decoration: none; font-weight: 600; }
    .mod { margin: 0 40px; border: 2px solid #C9DCC6; border-radius: 18px; background: #EEF4EA; height: 720px; display: grid; grid-template-columns: 1fr 1.05fr; overflow: hidden; }
    .plate { padding: 18px 22px; display: flex; gap: 10px; align-items: center; grid-column: 1 / -1; background: #FBFBF7; border-bottom: 1px solid #C9DCC6; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    .led { width: 10px; height: 10px; border-radius: 50%; background: #7A9A78; }
    .tile { margin-left: auto; background: #F3E9B4; color: #2E4030; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 12px; }
    .cam { background: #F8F3DC; display: flex; align-items: flex-end; justify-content: center; }
    .cam .face { width: 78%; height: 88%; background: #e5d7b8; border-radius: 12px 12px 0 0; }
    .read { padding: 48px 40px 36px; display: flex; flex-direction: column; justify-content: center; }
    h1 { font-family: "Cormorant Garamond", serif; font-size: 64px; font-weight: 500; line-height: 1.05; max-width: 9ch; }
    h1 em { font-style: italic; font-weight: 400; }
    p { margin: 18px 0 28px; font-size: 16px; color: #5A6B5C; }
    .cta { display: inline-block; background: #3E5A40; color: #FBFBF7; padding: 16px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; text-decoration: none; }
    .peek { margin: 8px 40px 0; height: 48px; border: 2px solid #C9DCC6; border-bottom: 0; border-radius: 14px 14px 0 0; background: #F8F3DC; padding: 12px 22px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #5A6B5C; }
  </style>
</head>
<body>
  <nav><b>Jaqueline Secundino</b><a href="#">WhatsApp</a></nav>
  <section class="mod">
    <div class="plate"><span class="led"></span> Canal 1 · Sessão · ON <span class="tile">aviso · peso</span></div>
    <div class="cam" aria-label="Jaqueline Secundino"><div class="face"></div></div>
    <div class="read">
      <h1>A sessão já está <em>aberta.</em></h1>
      <p>Terapeuta emocional<br />Sessões pelo Zoom</p>
      <a class="cta" href="#">Entrar pelo WhatsApp</a>
    </div>
  </section>
  <div class="peek">Canal 2 · Peso</div>
</body>
</html>
